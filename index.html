<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1E6D2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E2A3A" media="(prefers-color-scheme: dark)">
<title>One Line a Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Karla:wght@400;500;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1E6D2; --surface:#FBF6EC; --ink:#2C3E55; --muted:#7A6E5D; --line:#E0D2B8;
  --rose:#A63D2F; --rose-soft:#F0D3C4; --moss:#9A6B12; --moss-soft:#F5E6B8;
  --stitch:#C9A66B; --check:rgba(166,61,47,.28);
  --display:"Rye", "Rockwell", Georgia, serif;
  --ui:"Karla", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --line-font:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E2A3A; --surface:#283850; --ink:#F3E9D7; --muted:#B9AE9A; --line:#3B4C66;
    --rose:#E2725B; --rose-soft:#4D3433; --moss:#E9C46A; --moss-soft:#45402C;
    --stitch:#8C7650; --check:rgba(226,114,91,.22);
  }
}
:root[data-theme="dark"]{
  --bg:#1E2A3A; --surface:#283850; --ink:#F3E9D7; --muted:#B9AE9A; --line:#3B4C66;
  --rose:#E2725B; --rose-soft:#4D3433; --moss:#E9C46A; --moss-soft:#45402C;
  --stitch:#8C7650; --check:rgba(226,114,91,.22);
}
/* Americana touches: gingham band, denim stitching, handwritten lines */
body::before{content:"";display:block;height:22px;background-color:var(--bg);
  background-image:linear-gradient(90deg,var(--check) 50%,transparent 50%),linear-gradient(var(--check) 50%,transparent 50%);
  background-size:14px 14px;border-bottom:2px solid var(--rose)}
.page{position:relative}
.page::before{content:"";position:absolute;inset:7px;border:1.5px dashed var(--stitch);border-radius:16px;pointer-events:none}
textarea,.entry .txt,.sheet .line{font-style:normal !important;font-weight:500}
.star{color:var(--rose);margin-right:4px}
.remind{display:block;margin:18px auto 0;background:none;border:0;color:var(--rose);font-weight:700;text-decoration:underline;text-underline-offset:4px;text-decoration-style:dashed}
.otd{background:var(--surface);border-radius:18px;padding:16px 18px 6px;position:relative}
.otd::before{content:"";position:absolute;inset:6px;border:1.5px dashed var(--stitch);border-radius:13px;pointer-events:none}
.otd .entry{position:relative}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 4px;font-weight:700}
.field input{font:inherit;font-size:22px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}
a.btn{display:block;text-align:center;text-decoration:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
img{max-width:100%;display:block}
.app{max-width:480px;margin:0 auto;padding:20px 20px 110px}
.hidden{display:none !important}

/* Today */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.weekday{font-weight:500;color:var(--muted);margin:8px 0 0}
.bigdate{font-family:var(--display);font-weight:400;font-size:clamp(40px,12.5vw,60px);line-height:1;margin:6px 0 0;color:var(--rose)}
.streak{margin:14px 0 0;color:var(--muted);font-size:15px}
.streak b{color:var(--rose);font-weight:700}
.iconbtn{background:none;border:0;padding:10px;border-radius:50%;color:var(--muted);line-height:0}
.iconbtn:hover{background:var(--line)}

.page{background:var(--surface);border-radius:22px;padding:20px 20px 16px;margin-top:26px;
  box-shadow:0 1px 0 var(--line), 0 18px 40px -28px rgba(35,38,74,.45)}
.editing-other{margin:0 0 10px;font-size:14px;color:var(--rose);display:flex;justify-content:space-between;gap:8px}
.editing-other button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:14px}
textarea{width:100%;min-height:118px;border:0;background:transparent;resize:none;color:var(--ink);
  font-family:var(--line-font);font-style:italic;font-size:30px;line-height:1.2;padding:0}
textarea::placeholder{color:var(--muted);opacity:.7}
textarea:focus{outline:none}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-top:6px;min-height:20px}
.meta .warn{color:var(--rose)}

.attach{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.chip{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);background:transparent;
  border-radius:14px;padding:13px 10px;font-weight:500;font-size:15px}
.chip:hover{border-color:var(--muted)}
.chip.recording{border-style:solid;border-color:var(--rose);background:var(--rose-soft);color:var(--rose)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--rose);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}

.preview-photo{position:relative;margin-top:14px}
.preview-photo img{border-radius:14px;width:100%;max-height:340px;object-fit:cover}
.remove{position:absolute;top:8px;right:8px;background:rgba(25,27,51,.7);color:#fff;border:0;border-radius:20px;padding:5px 12px;font-size:13px}
.preview-audio{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--moss-soft);border-radius:14px;padding:8px 10px}
.preview-audio audio{flex:1;min-width:0;height:38px}
.preview-audio .remove{position:static;background:transparent;color:var(--moss);padding:6px}

.save{width:100%;margin-top:18px;border:0;border-radius:16px;padding:16px;background:var(--rose);color:#FBF6EC;letter-spacing:.02em;font-weight:700;font-size:17px;transition:transform .15s}
.save:active{transform:scale(.98)}
.save:disabled{opacity:.35;cursor:default}
.saved-note{text-align:center;color:var(--moss);font-size:14px;margin:10px 0 0;min-height:21px}

.lookback{margin-top:30px}
.lookback h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 10px;color:var(--ink)}

/* Entry cards */
.entry{display:flex;gap:14px;align-items:flex-start;background:none;border:0;text-align:left;width:100%;padding:12px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .thumb{flex:0 0 58px;height:58px;border-radius:12px;background:var(--line) center/cover no-repeat}
.entry .when{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.entry .txt{font-family:var(--line-font);font-style:italic;font-size:24px;line-height:1.2;margin-top:2px}

/* Days */
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.monthbar h1{font-family:var(--display);font-weight:400;font-size:32px;margin:0;line-height:1;color:var(--rose)}
.monthbar .yr{display:block;font-family:var(--ui);font-size:15px;color:var(--muted);margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:22px}
.dow{text-align:center;font-size:12px;color:var(--muted);padding-bottom:2px}
.day{aspect-ratio:1;border-radius:12px;border:0;background:transparent;font-size:14px;position:relative;
  display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;padding:0}
.day.has{background-color:var(--rose-soft);color:var(--rose);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--stitch)}
.day.photo{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.day.photo::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.day.today{box-shadow:inset 0 0 0 2px var(--rose)}
.day.future{opacity:.3;cursor:default}
.day.blank{visibility:hidden}
.monthlist{margin-top:26px}
.empty{color:var(--muted);text-align:center;padding:26px 10px}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--rose)}
.nav button{flex:0 1 180px;border:0;background:transparent;border-radius:14px;padding:11px;font-weight:700;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(25,27,51,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;
  padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1.1;color:var(--rose)}
.sheet .sub{color:var(--muted);margin:4px 0 16px;font-size:15px}
.sheet .line{font-family:var(--line-font);font-style:italic;font-size:30px;line-height:1.2;margin:16px 0}
.sheet img{border-radius:16px;width:100%}
.sheet audio{width:100%;margin-top:12px}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:13px;font-weight:700;font-size:15px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--rose)}
.sheet p{margin:0 0 12px}
.fine{font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;font-size:15px;z-index:20}
</style>
</head>
<body>
<div class="app">

  <!-- TODAY -->
  <section id="todayView" aria-label="Today">
    <div class="top">
      <div>
        <p class="weekday" id="weekday"></p>
        <h1 class="bigdate" id="bigdate"></h1>
      </div>
      <button class="iconbtn" id="settingsBtn" aria-label="Backup and settings">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
      </button>
    </div>
    <p class="streak" id="streak"></p>

    <div class="page">
      <p class="editing-other hidden" id="editingOther"><span id="editingLabel"></span><button id="backToToday">Back to today</button></p>
      <label for="sentence" class="hidden">Your sentence</label>
      <textarea id="sentence" maxlength="240" placeholder="Write today down in one line…"></textarea>
      <div class="meta"><span id="hint"></span><span id="count">0/240</span></div>

      <div id="photoPreview" class="preview-photo hidden">
        <img id="photoImg" alt="Today's photo">
        <button class="remove" id="removePhoto">Remove</button>
      </div>
      <div id="audioPreview" class="preview-audio hidden">
        <audio id="audioEl" controls></audio>
        <button class="remove" id="removeAudio" aria-label="Remove voice note">✕</button>
      </div>

      <div class="attach">
        <button class="chip" id="photoBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span id="photoBtnLabel">Add a photo</span>
        </button>
        <button class="chip" id="voiceBtn">
          <svg id="micIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <span class="dot hidden" id="recDot"></span>
          <span id="voiceLabel">Voice note</span>
        </button>
      </div>
      <input type="file" id="photoInput" accept="image/*" class="hidden">
      <input type="file" id="audioInput" accept="audio/*" capture class="hidden">

      <button class="save" id="saveBtn" disabled>Save today</button>
      <p class="saved-note" id="savedNote" aria-live="polite"></p>
    </div>
    <button class="remind hidden" id="remindBtn">⏰ Set a daily reminder</button>

    <div class="lookback hidden" id="lookback">
      <h2 id="lookbackTitle"></h2>
      <div class="otd" id="lookbackList"></div>
    </div>
  </section>

  <!-- DAYS -->
  <section id="daysView" class="hidden" aria-label="All days">
    <div class="monthbar">
      <button class="iconbtn" id="prevMonth" aria-label="Previous month">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1 id="monthTitle" style="text-align:center"></h1>
      <button class="iconbtn" id="nextMonth" aria-label="Next month">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="monthlist" id="monthList"></div>
  </section>
</div>

<nav class="nav">
  <button id="navToday" aria-current="page">Today</button>
  <button id="navDays">All days</button>
</nav>

<div id="sheetHost"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const fmtLong = d => d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtShort = d => d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

/* ---------- Storage (IndexedDB, falls back to memory) ---------- */
let idb = null; let memory = new Map(); let storageOK = true;
function openDB(){
  return new Promise(res => {
    try{
      const r = indexedDB.open('one-line-a-day',1);
      r.onupgradeneeded = () => r.result.createObjectStore('entries',{keyPath:'date'});
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    }catch(e){ res(null); }
  });
}
function tx(mode, fn){
  return new Promise((res,rej) => {
    const t = idb.transaction('entries',mode); const s = t.objectStore('entries');
    const out = fn(s); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
  });
}
const store = {
  async all(){ if(!idb) return [...memory.values()]; return tx('readonly', s => s.getAll()); },
  async put(e){ if(!idb){ memory.set(e.date,e); return; } await tx('readwrite', s => s.put(e)); },
  async del(k){ if(!idb){ memory.delete(k); return; } await tx('readwrite', s => s.delete(k)); }
};
let entries = new Map();
async function loadAll(){ const list = await store.all(); entries = new Map(list.map(e => [e.date,e])); }

/* Media kept as {buf: ArrayBuffer, type} for broad IndexedDB support */
const toMedia = async blob => blob ? {buf: await blob.arrayBuffer(), type: blob.type || 'application/octet-stream'} : null;
const urlCache = new Map();
function mediaURL(key, m){
  if(!m) return null;
  const c = urlCache.get(key); if(c && c.buf === m.buf) return c.url;
  if(c) URL.revokeObjectURL(c.url);
  const url = URL.createObjectURL(new Blob([m.buf],{type:m.type}));
  urlCache.set(key,{buf:m.buf,url}); return url;
}

/* ---------- Editor state ---------- */
const todayKey = () => keyOf(new Date());
let editKey = todayKey();
let draft = {text:'', photo:null, audio:null};
let dirty = false;

function loadDraft(k){
  editKey = k; const e = entries.get(k);
  draft = e ? {text:e.text||'', photo:e.photo||null, audio:e.audio||null} : {text:'',photo:null,audio:null};
  dirty = false; $('savedNote').textContent = e ? 'Saved' : '';
  renderEditor();
}
function renderEditor(){
  const d = fromKey(editKey); const isToday = editKey === todayKey();
  $('weekday').textContent = d.toLocaleDateString('en-GB',{weekday:'long'});
  $('bigdate').textContent = d.toLocaleDateString('en-GB',{day:'numeric',month:'long'});
  $('editingOther').classList.toggle('hidden', isToday);
  $('editingLabel').textContent = isToday ? '' : `Editing ${fmtShort(d)}`;
  $('sentence').value = draft.text; updateCount();
  $('photoPreview').classList.toggle('hidden', !draft.photo);
  if(draft.photo) $('photoImg').src = mediaURL('draft-photo', draft.photo);
  $('photoBtnLabel').textContent = draft.photo ? 'Change photo' : 'Add a photo';
  $('audioPreview').classList.toggle('hidden', !draft.audio);
  if(draft.audio) $('audioEl').src = mediaURL('draft-audio', draft.audio);
  $('voiceLabel').textContent = draft.audio ? 'Re-record' : 'Voice note';
  $('saveBtn').textContent = entries.has(editKey) ? 'Save changes' : (isToday ? 'Save today' : 'Save this day');
  updateSaveState();
}
function updateCount(){
  const v = $('sentence').value; $('count').textContent = `${v.length}/240`;
  const multi = /[.!?]+["')\]]*\s+[A-Z0-9"']/.test(v.trim());
  $('hint').innerHTML = multi ? '<span class="warn">Just one sentence — try a comma or a dash</span>' : '';
}
function updateSaveState(){
  const has = draft.text.trim() || draft.photo || draft.audio;
  $('saveBtn').disabled = !(has && (dirty || !entries.has(editKey)));
}
function markDirty(){ dirty = true; $('savedNote').textContent=''; updateSaveState(); }

$('sentence').addEventListener('input', e => { draft.text = e.target.value; updateCount(); markDirty(); });
$('backToToday').onclick = () => loadDraft(todayKey());

/* Photo: compress to max 1600px JPEG */
$('photoBtn').onclick = () => $('photoInput').click();
$('photoInput').onchange = async e => {
  const f = e.target.files[0]; e.target.value=''; if(!f) return;
  try{ draft.photo = await toMedia(await compress(f)); }catch(err){ draft.photo = await toMedia(f); }
  markDirty(); renderEditor();
};
function compress(file){
  return new Promise((res,rej) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1600; let {naturalWidth:w, naturalHeight:h} = img;
      const s = Math.min(1, max/Math.max(w,h)); w = Math.round(w*s); h = Math.round(h*s);
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(), 'image/jpeg', .85);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(); };
    img.src = u;
  });
}
$('removePhoto').onclick = () => { draft.photo = null; markDirty(); renderEditor(); };

/* Voice: record in-page, or fall back to the phone's recorder */
let rec = null, recTimer = null, recStart = 0;
const MAX_REC = 60;
$('voiceBtn').onclick = async () => {
  if(rec){ rec.stop(); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){ $('audioInput').click(); return; }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ $('audioInput').click(); return; }
  const types = ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'];
  const mimeType = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
  rec = new MediaRecorder(stream, mimeType ? {mimeType} : undefined);
  const chunks = [];
  rec.ondataavailable = ev => ev.data.size && chunks.push(ev.data);
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop()); clearInterval(recTimer);
    const blob = new Blob(chunks,{type: rec.mimeType || 'audio/webm'}); rec = null;
    setRecUI(false);
    if(blob.size){ draft.audio = await toMedia(blob); markDirty(); }
    renderEditor();
  };
  rec.start(); recStart = Date.now(); setRecUI(true);
  recTimer = setInterval(() => {
    const s = Math.floor((Date.now()-recStart)/1000);
    $('voiceLabel').textContent = `Stop · 0:${pad(s)}`;
    if(s >= MAX_REC && rec) rec.stop();
  }, 250);
};
function setRecUI(on){
  $('voiceBtn').classList.toggle('recording', on);
  $('recDot').classList.toggle('hidden', !on); $('micIcon').classList.toggle('hidden', on);
  $('voiceLabel').textContent = on ? 'Stop · 0:00' : (draft.audio ? 'Re-record' : 'Voice note');
}
$('audioInput').onchange = async e => {
  const f = e.target.files[0]; e.target.value=''; if(!f) return;
  draft.audio = await toMedia(f); markDirty(); renderEditor();
};
$('removeAudio').onclick = () => { draft.audio = null; markDirty(); renderEditor(); };

/* Save */
$('saveBtn').onclick = async () => {
  const e = {date:editKey, text:draft.text.trim(), photo:draft.photo, audio:draft.audio, updated:Date.now()};
  try{ await store.put(e); }catch(err){ toast('Couldn’t save — phone storage may be full'); return; }
  entries.set(editKey, e); dirty = false;
  $('savedNote').textContent = 'Saved'; updateSaveState();
  $('saveBtn').textContent = 'Save changes';
  renderStreak(); renderLookback();
  if(!storageOK) toast('Saved for now — this browser won’t keep it after closing');
};

/* Streak + look back */
function renderStreak(){
  let n = 0; const d = new Date();
  if(!entries.has(keyOf(d))) d.setDate(d.getDate()-1);
  while(entries.has(keyOf(d))){ n++; d.setDate(d.getDate()-1); }
  const total = entries.size;
  $('streak').innerHTML = total === 0 ? 'Your first line starts here.'
    : n > 1 ? `<span class="star">★</span><b>${n} days</b> in a row · ${total} line${total>1?'s':''} so far`
    : `<span class="star">★</span>${total} line${total>1?'s':''} so far`;
}
function renderLookback(){
  const t = new Date(); const tk = keyOf(t); const md = tk.slice(5);
  let title, picks = [];
  // Every earlier year on today's date
  const past = [...entries.values()].filter(e => e.date.slice(5)===md && e.date < tk).sort((a,b)=>b.date.localeCompare(a.date));
  if(past.length){
    title = 'On this day';
    picks = past.map(e => { const n = t.getFullYear() - Number(e.date.slice(0,4)); return [e.date, n===1 ? 'One year ago' : `${n} years ago`]; });
  } else {
    // Until she has a year of lines, look back a week and a month
    title = 'Looking back';
    const mo = new Date(t); mo.setMonth(t.getMonth()-1);
    const wk = new Date(t); wk.setDate(t.getDate()-7);
    [[wk,'A week ago today'],[mo,'A month ago today']].forEach(([d,l]) => { if(entries.has(keyOf(d))) picks.push([keyOf(d),l]); });
  }
  $('lookback').classList.toggle('hidden', !picks.length);
  if(!picks.length) return;
  $('lookbackTitle').textContent = title;
  $('lookbackList').replaceChildren(...picks.map(([k,l]) => entryRow(entries.get(k), l)));
}

/* Daily reminder via a repeating Google Calendar event */
const ls = { get:k => { try{ return localStorage.getItem(k); }catch(e){ return null; } }, set:(k,v) => { try{ localStorage.setItem(k,v); }catch(e){} } };
const topLevel = (() => { try{ return window.self === window.top; }catch(e){ return false; } })();
function reminderURL(time){
  const [h,m] = time.split(':').map(Number);
  const s = new Date(); s.setHours(h,m,0,0); const e = new Date(s.getTime()+5*60000);
  const f = x => `${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
  const link = topLevel && location.protocol==='https:' ? `\n\nOpen the app: ${location.href.split('#')[0]}` : '';
  const p = new URLSearchParams({action:'TEMPLATE', text:'★ One line a day', details:`A sentence, a photo or a voice note — whatever today was.${link}`,
    dates:`${f(s)}/${f(e)}`, ctz:Intl.DateTimeFormat().resolvedOptions().timeZone, recur:'RRULE:FREQ=DAILY'});
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}
function renderRemindBtn(){ $('remindBtn').classList.toggle('hidden', !!ls.get('reminderTime')); }
function openReminder(){
  sheet((s, close) => {
    const saved = ls.get('reminderTime') || '21:00';
    s.innerHTML = `<h2>Daily reminder</h2>
      <p class="sub">A nudge each day to add her line</p>
      <label class="field" for="remTime">Remind me at <input type="time" id="remTime" value="${saved}"></label>
      <div class="row"><a class="btn primary" id="remGo" target="_blank" rel="noopener">Add to Google Calendar</a></div>
      <p class="fine" style="margin-top:16px">This adds a repeating daily event. In the event, set the notification to <b>At time of event</b> so it pops up right on time.</p>
      <p class="fine">Not a Google Calendar person? Open the Clock app and add a daily alarm called “One line a day” instead.</p>`;
    const inp = s.querySelector('#remTime'), go = s.querySelector('#remGo');
    const upd = () => { go.href = reminderURL(inp.value || '21:00'); };
    inp.oninput = upd; upd();
    go.onclick = () => { ls.set('reminderTime', inp.value || '21:00'); renderRemindBtn(); setTimeout(close, 400); };
  });
}
$('remindBtn').onclick = openReminder;
function entryRow(e, label){
  const b = document.createElement('button'); b.className='entry';
  const th = document.createElement('div'); th.className='thumb';
  if(e.photo) th.style.backgroundImage = `url(${mediaURL(e.date+'-p', e.photo)})`;
  else { th.style.display='none'; }
  const body = document.createElement('div');
  const when = document.createElement('div'); when.className='when';
  when.textContent = (label || fmtShort(fromKey(e.date))) + (e.audio ? '  ·  voice note' : '');
  const txt = document.createElement('div'); txt.className='txt';
  txt.textContent = e.text || (e.photo ? 'A photo' : 'A voice note');
  body.append(when, txt); b.append(th, body);
  b.onclick = () => openEntry(e.date);
  return b;
}

/* Days view */
let viewMonth = new Date(); viewMonth.setDate(1);
function renderMonth(){
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
  $('monthTitle').innerHTML = `${viewMonth.toLocaleDateString('en-GB',{month:'long'})}<span class="yr">${y}</span>`;
  const g = $('grid'); g.replaceChildren();
  ['M','T','W','T','F','S','S'].forEach(x => { const s=document.createElement('div'); s.className='dow'; s.textContent=x; g.append(s); });
  const first = (new Date(y,m,1).getDay()+6)%7; const days = new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++){ const b=document.createElement('div'); b.className='day blank'; g.append(b); }
  const tk = todayKey(); const now = new Date();
  for(let d=1; d<=days; d++){
    const k = keyOf(new Date(y,m,d)); const e = entries.get(k);
    const b = document.createElement('button'); b.className='day'; b.textContent=d;
    const future = new Date(y,m,d) > now;
    if(e){ b.classList.add('has'); if(e.photo){ b.classList.add('photo'); b.style.backgroundImage=`url(${mediaURL(k+'-p',e.photo)})`; } }
    if(k===tk) b.classList.add('today');
    if(future){ b.classList.add('future'); b.disabled = true; }
    b.setAttribute('aria-label', fromKey(k).toLocaleDateString('en-GB',{day:'numeric',month:'long'}) + (e ? ', has a line' : ''));
    b.onclick = () => e ? openEntry(k) : (loadDraft(k), show('today'));
    g.append(b);
  }
  const list = [...entries.values()].filter(e => e.date.startsWith(`${y}-${pad(m+1)}`)).sort((a,b)=>b.date.localeCompare(a.date));
  const ml = $('monthList');
  if(!list.length){ ml.innerHTML = '<p class="empty">No lines this month yet. Tap any past day to fill it in.</p>'; }
  else ml.replaceChildren(...list.map(e => entryRow(e)));
  const nm = new Date(y,m+1,1); $('nextMonth').disabled = nm > now; $('nextMonth').style.opacity = nm > now ? .3 : 1;
}
$('prevMonth').onclick = () => { viewMonth.setMonth(viewMonth.getMonth()-1); renderMonth(); };
$('nextMonth').onclick = () => { viewMonth.setMonth(viewMonth.getMonth()+1); renderMonth(); };

/* Sheets */
function sheet(build){
  const scrim = document.createElement('div'); scrim.className='scrim';
  const s = document.createElement('div'); s.className='sheet'; s.setAttribute('role','dialog'); s.setAttribute('aria-modal','true');
  scrim.append(s); scrim.onclick = ev => { if(ev.target===scrim) close(); };
  const close = () => scrim.remove();
  build(s, close); $('sheetHost').append(scrim);
  const f = s.querySelector('button'); f && f.focus({preventScroll:true});
  return close;
}
document.addEventListener('keydown', e => { if(e.key==='Escape'){ const sc = document.querySelector('.scrim'); sc && sc.remove(); } });

function openEntry(k){
  const e = entries.get(k); if(!e) return;
  sheet((s, close) => {
    const d = fromKey(k);
    s.innerHTML = `<h2>${d.toLocaleDateString('en-GB',{day:'numeric',month:'long'})}</h2><p class="sub">${d.toLocaleDateString('en-GB',{weekday:'long',year:'numeric'})}</p>`;
    if(e.photo){ const i=document.createElement('img'); i.src=mediaURL(k+'-p',e.photo); i.alt='Photo from this day'; s.append(i); }
    if(e.text){ const p=document.createElement('p'); p.className='line'; p.textContent=e.text; s.append(p); }
    if(e.audio){ const a=document.createElement('audio'); a.controls=true; a.src=mediaURL(k+'-a',e.audio); s.append(a); }
    const row = document.createElement('div'); row.className='row';
    const edit = document.createElement('button'); edit.className='btn primary'; edit.textContent='Edit';
    edit.onclick = () => { close(); loadDraft(k); show('today'); };
    const del = document.createElement('button'); del.className='btn danger'; del.textContent='Delete';
    del.onclick = async () => {
      if(del.dataset.sure){ await store.del(k); entries.delete(k); close(); if(editKey===k) loadDraft(k); renderAll(); toast('Deleted'); }
      else { del.dataset.sure='1'; del.textContent='Tap again to delete'; }
    };
    row.append(edit, del); s.append(row);
  });
}

/* Backup */
const b64 = buf => { let s=''; const a=new Uint8Array(buf); for(let i=0;i<a.length;i+=0x8000) s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000)); return btoa(s); };
const unb64 = s => { const bin=atob(s); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a.buffer; };
const packM = m => m ? {type:m.type, data:b64(m.buf)} : null;
const unpackM = m => m ? {type:m.type, buf:unb64(m.data)} : null;

$('settingsBtn').onclick = () => sheet((s, close) => {
  s.innerHTML = `<h2>Keep it safe</h2>
    <p class="sub">${entries.size} line${entries.size===1?'':'s'} on this phone</p>
    <p class="fine">Everything stays on this phone only — nobody else can see it. Save a backup now and then, so clearing the browser or changing phones doesn’t lose anything.</p>
    ${storageOK ? '' : '<p class="fine" style="color:var(--rose)">This browser isn’t letting the app store things permanently, so save a backup before closing.</p>'}`;
  const row = document.createElement('div'); row.className='row';
  const ex = document.createElement('button'); ex.className='btn primary'; ex.textContent='Save a backup';
  const im = document.createElement('button'); im.className='btn'; im.textContent='Restore a backup';
  row.append(ex, im); s.append(row);
  const row2 = document.createElement('div'); row2.className='row';
  const rm = document.createElement('button'); rm.className='btn';
  const rt = ls.get('reminderTime'); rm.textContent = rt ? `⏰ Reminder set for ${rt} · change` : '⏰ Set a daily reminder';
  rm.onclick = () => { close(); openReminder(); };
  row2.append(rm); s.append(row2);
  ex.onclick = async () => {
    if(!entries.size){ toast('Nothing to back up yet'); return; }
    ex.disabled = true; ex.textContent='Packing…';
    const data = {app:'one-line-a-day', version:1, exported:new Date().toISOString(),
      entries:[...entries.values()].map(e => ({date:e.date,text:e.text,updated:e.updated,photo:packM(e.photo),audio:packM(e.audio)}))};
    const blob = new Blob([JSON.stringify(data)],{type:'application/json'});
    const name = `one-line-a-day-backup-${todayKey()}.json`;
    await download(name, blob);
    ex.disabled=false; ex.textContent='Save a backup';
  };
  im.onclick = () => {
    const inp = document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
    inp.onchange = async () => {
      const f = inp.files[0]; if(!f) return;
      try{
        const data = JSON.parse(await f.text());
        if(data.app!=='one-line-a-day' || !Array.isArray(data.entries)) throw 0;
        let added=0;
        for(const r of data.entries){
          const cur = entries.get(r.date);
          if(cur && (cur.updated||0) >= (r.updated||0)) continue;
          const e = {date:r.date,text:r.text||'',updated:r.updated||Date.now(),photo:unpackM(r.photo),audio:unpackM(r.audio)};
          await store.put(e); entries.set(e.date,e); added++;
        }
        close(); renderAll(); loadDraft(editKey);
        toast(added ? `Restored ${added} line${added>1?'s':''}` : 'Already up to date');
      }catch(err){ toast('That file isn’t a One Line a Day backup'); }
    };
    inp.click();
  };
});
async function download(name, blob){
  let dl = null;
  try{ if(window.claude && window.claude.use) dl = await Promise.race([window.claude.use('downloads'), new Promise(r=>setTimeout(()=>r(null),3000))]); }catch(e){}
  if(dl){
    try{ await dl.save({filename:name, data:blob}); toast('Backup saved'); }
    catch(e){ if(e && e.code!=='declined') toast('Couldn’t save the backup here'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* Nav */
function show(v){
  $('todayView').classList.toggle('hidden', v!=='today');
  $('daysView').classList.toggle('hidden', v!=='days');
  $('navToday').toggleAttribute('aria-current', v==='today'); if(v==='today') $('navToday').setAttribute('aria-current','page');
  $('navDays').toggleAttribute('aria-current', v==='days'); if(v==='days') $('navDays').setAttribute('aria-current','page');
  if(v==='days') renderMonth();
  window.scrollTo(0,0);
}
$('navToday').onclick = () => { if(editKey!==todayKey() && !dirty) loadDraft(todayKey()); show('today'); };
$('navDays').onclick = () => show('days');

let toastT;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg;
  document.body.append(t); clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), 2600);
}
function renderAll(){ renderStreak(); renderLookback(); renderRemindBtn(); if(!$('daysView').classList.contains('hidden')) renderMonth(); }

/* Roll over at midnight if left open */
let lastDay = todayKey();
setInterval(() => { if(todayKey()!==lastDay){ const was = lastDay; lastDay = todayKey(); if(editKey===was && !dirty) loadDraft(lastDay); renderAll(); } }, 30000);

/* Boot */
(async () => {
  idb = await openDB();
  if(!idb){ storageOK = false; }
  else { try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} }
  try{ await loadAll(); }catch(e){ storageOK = false; idb = null; }
  loadDraft(todayKey()); renderAll();
  // Installable app support when hosted on its own site
  if(topLevel && location.protocol==='https:' && !/claude\.ai|claudeusercontent/.test(location.host)){
    const l = document.createElement('link'); l.rel='manifest'; l.href='manifest.webmanifest'; document.head.append(l);
    const a = document.createElement('link'); a.rel='apple-touch-icon'; a.href='icon-192.png'; document.head.append(a);
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
})();
</script>
